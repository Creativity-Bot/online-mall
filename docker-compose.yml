services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlinemall
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化业务表（上级目录的 schema.sql）
      - ../schema.sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onlinemall-app
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: onlinemall
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      # 指向另一组 Compose 里 Temporal 的「服务名:端口」
      # 把 temporal 换成你那边实际的 service 名
      TEMPORAL_TARGET: temporal:7233
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - default
      # 加入 Temporal 那组 Compose 的网络
      - temporal-network

volumes:
  mysql_data:

networks:
  temporal-network:
    external: true
    name: temporal-network
